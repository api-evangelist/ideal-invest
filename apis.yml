name: Ideal Invest
description: 'Ideal Invest (operating as Pravaler) is a Brazilian fintech founded in 2002 and
  headquartered in Sao Paulo that provides private student financing for higher education. Through
  its Pravaler platform, students can split tuition payments across roughly twice the duration of a
  course, with a 100% digital, low-bureaucracy application, competitive monthly interest rates, and
  no ENEM requirement. Pravaler works with a network of 500+ partner higher-education institutions and
  has financed more than 400,000 students, channeling over R$12 billion into Brazilian education. The
  company is backed by Ribbit Capital. As of this enrichment pass Pravaler exposes a consumer web
  platform (simulation, application, digital signature) but publishes no public developer API,
  OpenAPI, SDK, or partner integration surface.'
